<!DOCTYPE html>
<html lang="es">
	
<head>
	<title>Registro</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
	<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
	<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
	<link rel="stylesheet" type="text/css" href="css/util.css">
	<link rel="stylesheet" type="text/css" href="css/main.css">
</head>

<body>
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100 wrap-register100">
				<form id="registroForm" class="login100-form register100-form validate-form" novalidate>
					<span class="login100-form-title register100-form-title">
						Registra tu cuenta
					</span>

					<div class="register-form-grid">
						<div class="wrap-input100 validate-input" data-validate="Nombre y apellido obligatorios">
							<input class="input100" type="text" name="nombre" id="name" placeholder="Nombre y apellido"
								required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ]+(?:[ ][A-Za-zÁÉÍÓÚáéíóúÑñ]+)+"autocomplete="name">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-user" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>

						<div class="wrap-input100 validate-input" data-validate="RUT obligatorio y válido">
							<input class="input100" type="text" name="rut" id="rut" placeholder="RUT" required
								pattern="^\d{1,2}\.\d{3}\.\d{3}-[0-9Kk]$" maxlength="12" autocomplete="off"
								inputmode="numeric">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-id-card" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>

						<div class="wrap-input100 validate-input" data-validate="Correo obligatorio: ejemplo@abc.xyz">
							<input class="input100" type="email" id="campoCorreo" name="correo" placeholder="Correo"
								required pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" autocomplete="email">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-envelope" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>

						<div class="wrap-input100 validate-input" data-validate="Usuario obligatorio">
							<input class="input100" type="text" name="usuario" placeholder="Usuario" required
								pattern="[A-Za-z0-9_]{3,10}" minlength="3" maxlength="10" autocomplete="username">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-user-circle" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>

						<div class="wrap-input100 validate-input" data-validate="Contraseña obligatoria">
							<input class="input100" type="password" name="contraseña" placeholder="Contraseña" required
								pattern="\S{4,8}" minlength="4" maxlength="8" autocomplete="new-password">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-lock" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>

						<div class="wrap-input100 validate-input" data-validate="Teléfono obligatorio">
							<input class="input100" type="tel" name="telefono" id="telefono" placeholder="Teléfono"
								required pattern="9[0-9]{8}" maxlength="9" inputmode="numeric" value="9">
							<span class="focus-input100"></span>
							<span class="symbol-input100">
								<i class="fa fa-phone" aria-hidden="true"></i>
							</span>
							<span class="validation-icon" aria-label="Ver mensaje de error" role="img">&#xf06a;</span>
							<i class="fa fa-check-circle validation-icon-success" aria-label="Campo válido" role="img"></i>
						</div>
					</div>

					<div class="container-login100-form-btn register-form-actions">
						<button type="submit" class="login100-form-btn">
							Registrar
						</button>
						<button id="btnOtroRegistro" type="button" class="login100-form-btn register-secondary-btn">
							Otro registro
						</button>
					</div>

					<div class="text-center p-t-20">
						<a class="txt2" href="index.html">¿Ya tienes una cuenta?</a>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
	<script src="vendor/select2/select2.min.js"></script>
	<script src="vendor/tilt/tilt.jquery.min.js"></script>
	<script>
		$('.js-tilt').tilt({
			scale: 1.1
		})

		document.getElementById('btnOtroRegistro').addEventListener('click', function () {
			document.getElementById('registroForm').reset();
			document.querySelectorAll('#registroForm .wrap-input100').forEach(function (contenedor) {
				contenedor.classList.remove('alert-validate');
				contenedor.classList.remove('confirm-validate');
			});
			document.querySelector('#registroForm input').focus();
		});

		const campoNombre = document.querySelector('input[name="nombre"]');
		const campoRut = document.querySelector('input[name="rut"]');
		const campoCorreo = document.querySelector('input[name="correo"]');
		const campoUsuario = document.querySelector('input[name="usuario"]');
		const campoContrasena = document.querySelector('input[name="contraseña"]');
		const campoTelefono = document.querySelector('input[name="telefono"]');

		campoNombre.addEventListener('input', function () {
			this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ ]/g, '').replace(/\s{2,}/g, ' ');
		});

		campoNombre.addEventListener('blur', function () {
			this.value = this.value.trim();
		});

		campoRut.addEventListener('input', function () {
			const caracteresRut = this.value.replace(/[^0-9Kk]/g, '').toUpperCase();
			if (caracteresRut.length < 8) {
				this.value = caracteresRut;
				return;
			}

			const cuerpo = caracteresRut.slice(0, -1).slice(0, 8);
			const digitoVerificador = caracteresRut.slice(-1);

			const cuerpoFormateado = cuerpo.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
			this.value = cuerpoFormateado + (digitoVerificador ? '-' + digitoVerificador : '');
		});

		campoCorreo.addEventListener('input', function () {
			this.value = this.value.replace(/\s/g, '');
		});

		campoUsuario.addEventListener('input', function () {
			this.value = this.value.replace(/[^A-Za-z0-9_]/g, '');
		});

		campoContrasena.addEventListener('input', function () {
			this.value = this.value.replace(/\s/g, '');
		});

		campoTelefono.addEventListener('input', function () {
			this.value = this.value.replace(/\D/g, '').slice(0, 9);
		});

		function rutEsValido(rut) {
			const rutLimpio = rut.replace(/[.\-]/g, '').toUpperCase();
			if (!/^\d{7,8}[0-9K]$/.test(rutLimpio)) {
				return false;
			}
			const cuerpo = rutLimpio.slice(0, -1);
			const digitoEsperado = rutLimpio.slice(-1);
			let suma = 0;
			let multiplicador = 2;

			for (let indice = cuerpo.length - 1; indice >= 0; indice--) {
				suma += Number(cuerpo[indice]) * multiplicador;
				multiplicador = multiplicador === 7 ? 2 : multiplicador + 1;
			}

			const resto = 11 - (suma % 11);
			const digitoCalculado = resto === 11 ? '0' : resto === 10 ? 'K' : String(resto);
			return digitoEsperado === digitoCalculado;
		}

		function correoEsValido(valor) {
			return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(valor.trim());
		}


		function validarCampo(campo) {
			const contenedor = campo.closest('.wrap-input100');

			if (campo === campoRut) {
				campo.setCustomValidity(rutEsValido(campo.value) ? '' : 'Ingresa un RUT válido');
			}

			if (campo === campoCorreo) {
				campo.setCustomValidity(correoEsValido(campo.value) ? '' : 'Ingresa un correo válido (ejemplo@dominio.com)');
			}

			const campoValido = campo.checkValidity();

			contenedor.classList.toggle('confirm-validate', campoValido);
			contenedor.classList.toggle('alert-validate', !campoValido);

			return campoValido;
		}

		const camposRegistro = document.querySelectorAll('#registroForm input');

		camposRegistro.forEach(function (campo) {
			// Mientras el usuario escribe
			campo.addEventListener('input', function () {
				validarCampo(campo);
			});

			// Al salir del campo (blur), por si estaba vacío y no disparó "input"
			campo.addEventListener('blur', function () {
				validarCampo(campo);
			});
		});

		document.getElementById('registroForm').addEventListener('submit', function (event) {
			event.preventDefault();
			let formularioValido = true;
			let primerCampoInvalido = null;

			camposRegistro.forEach(function (campo) {
				const valido = validarCampo(campo);
				if (!valido && formularioValido) {
					formularioValido = false;
					primerCampoInvalido = campo;
				}
			});

			if (!formularioValido) {
				primerCampoInvalido.focus();
				return;
			}
			alert('En construcción');
		});
	</script>
	<script src="js/main.js"></script>
	<script src="js/registro.js"></script>
</body>

</html>
