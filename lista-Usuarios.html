<main class="admin-wrapper">

			<div class="admin-panel active">

				<div class="admin-toolbar">

						<input type="text" id="buscadorUsuarios" class="search-input" placeholder="Buscar por nombre, RUT o usuario...">
					</div>
				</div>

				<div class="table-responsive">
					<table class="table table-bordered table-reservas">
						<thead>
							<tr>
								<th>#</th>
								<th>Nombre</th>
								<th>RUT</th>
								<th>Correo</th>
								<th>Usuario</th>
								<th>Teléfono</th>
								<th>Rol</th>
								<th>Registrado</th>
							</tr>
						</thead>
						<tbody id="tablaUsuariosBody"></tbody>
					</table>
					<div id="estadoVacioUsuarios" class="empty-state">
						No hay usuarios registrados.
					</div>
				</div>
			</div>
