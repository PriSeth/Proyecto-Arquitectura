<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
	<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
	<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
	<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
	<link rel="stylesheet" type="text/css" href="css/util.css">
	<link rel="stylesheet" type="text/css" href="css/main.css">
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="images/Tifa.jpg" alt="IMG">
				</div>

				<form class="login100-form validate-form">
					<span class="login100-form-title">
						Iniciar Sesión
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Usuario es requerido">
						<input class="input100" type="text" name="usuario" id="inputUsuario" placeholder="Usuario"
						disabled>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Contraseña es requerida">
						<input class="input100" type="password" name="contraseña" id="inputContrasena" placeholder="Contraseña"
						disabled>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

					<div id="contadorIntentos" class="login-attempts" aria-live="polite">
						Intentos: 0 de 3
					</div>
					
					<!--Captcha-->
					<div class="text-center p-t-20 p-b-20">
						<div class="g-recaptcha" data-sitekey="6Ld3RaMtAAAAADLZz-tkFy3PLluQ2Q9ANcOoCiR1"
							data-callback="onCaptchaSuccess" data-expired-callback="onCaptchaExpired">
						</div>
					</div>

					<div class="container-login100-form-btn">
						<button id="btnLogin" class="login100-form-btn" type="button" disabled>
							Iniciar Sesión
						</button>
					</div>

					<div class="text-center p-t-12">
						<span class="txt1">
							Olvidaste tu
						</span>
						<a class="txt2" href="#">
							Correo / Contraseña?
						</a>
					</div>

					<div class="text-center p-t-136">
						<a class="txt2" href="registro.html">
							Crear tu Cuenta
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>

	<footer class="project-footer">
        Proyecto elaborado por: Luis Garcia, Mia Martinez, Diego Vargas
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="instagram-btn">
		<img src="images/Instagram-Logo.png" alt="Síguenos en Instagram">
      </a>
		<a class="map-icon" href="https://www.google.com/maps/search/?api=1&query=AIEP%20Rancagua" target="_blank" rel="noopener noreferrer" title="Ver ubicación en Google Maps" aria-label="Ver ubicación en Google Maps">
			<svg viewBox="0 0 24 24" fill="#EA4335" aria-hidden="true">
				<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
			</svg>
		</a>
    </footer>
	
	<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
	<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
	<script src="vendor/select2/select2.min.js"></script>
	<script src="vendor/tilt/tilt.jquery.min.js"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>
	<script src="js/main.js"></script>

</body>
</html>
